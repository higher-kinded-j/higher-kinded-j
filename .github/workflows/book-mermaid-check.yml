name: Book Checks

# Five things the published book cannot tell you are broken until a reader
# sees them, so they fail the PR instead:
#   - every ```mermaid fence in hkj-book/src is parsed against the pinned
#     browser-side mermaid library, catching a diagram syntax error before it
#     reaches the book as a render-time error box;
#   - every heading is checked for raw HTML, because a bare <S> in a heading is
#     the <s> element and silently strikes through the rest of the page;
#   - every cross-reference is resolved, because a link into a heading that has
#     been reworded lands the reader at the top of the page and says nothing;
#   - every chapter's Previous and Next links are checked against SUMMARY.md,
#     because a page added or moved there leaves its neighbours linking past it;
#   - the site announcement is checked against its format, because the book
#     shows nothing for one it cannot read and says nothing about why.
# The prose of the book's pages is also measured against the style guide's
# readability limits and compared with a committed baseline, so a pull request
# that raises a page's count of long sentences fails and says where.
# No branches filter on pull_request: stacked PRs are checked too. workflow_dispatch lets a
# contributor run every check on a branch of their fork, from the fork's Actions tab.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hkj-book/src/**'
      - '.github/scripts/fetch_mermaid.sh'
      - '.github/scripts/mermaid-check/**'
      - '.github/scripts/book-heading-html-check.cjs'
      - '.github/scripts/book-anchor-check.cjs'
      - '.github/scripts/announcement.json'
      - '.github/scripts/announcement-check.cjs'
      - '.github/scripts/book-prose.cjs'
      - '.github/scripts/book-readability-check.cjs'
      - '.github/scripts/book-readability-baseline.json'
      - '.github/scripts/chapter_footers.py'
      - '.github/scripts/book_sources.py'
      - '.github/workflows/book-mermaid-check.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'hkj-book/src/**'
      - '.github/scripts/fetch_mermaid.sh'
      - '.github/scripts/mermaid-check/**'
      - '.github/scripts/book-heading-html-check.cjs'
      - '.github/scripts/book-anchor-check.cjs'
      - '.github/scripts/announcement.json'
      - '.github/scripts/announcement-check.cjs'
      - '.github/scripts/book-prose.cjs'
      - '.github/scripts/book-readability-check.cjs'
      - '.github/scripts/book-readability-baseline.json'
      - '.github/scripts/chapter_footers.py'
      - '.github/scripts/book_sources.py'
      - '.github/workflows/book-mermaid-check.yml'

permissions:
  contents: read

jobs:
  parse-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # hkj-book/check.sh runs these same steps locally, in this order; keep the two in step.
      - name: Check headings for raw HTML
        run: node .github/scripts/book-heading-html-check.cjs

      - name: Check cross-reference anchors
        run: node .github/scripts/book-anchor-check.cjs

      - name: Check the site announcement
        run: node .github/scripts/announcement-check.cjs

      - name: Fetch pinned mermaid library
        run: .github/scripts/fetch_mermaid.sh

      - name: Install check dependencies
        working-directory: .github/scripts/mermaid-check
        run: npm ci --no-audit --no-fund

      - name: Parse-check mermaid diagrams
        run: node .github/scripts/mermaid-check/check.cjs

      # Even when a check before it failed, so a pull request sees every stale footer at once.
      - name: Check chapter footers against SUMMARY.md
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/chapter_footers.py --all --check

      # Last, and even when a check before it failed, so a pull request sees every rise at once.
      - name: Check readability against the baseline
        if: ${{ !cancelled() }}
        run: node .github/scripts/book-readability-check.cjs --strict

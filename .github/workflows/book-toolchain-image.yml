# Publishes the book toolchain image that hkj-book/docker.sh pulls, so a
# contributor does not compile the four mdbook tools themselves.
#
# The tag is a hash of hkj-book/toolchain-pins.sh and hkj-book/docker/Dockerfile
# (see `hkj-book/docker.sh image`), so it changes exactly when either does.
# docker.sh falls back to a local build if the image is not published, so a
# failure here never blocks a contributor.
#
# After the first publish, set the package's visibility to public in the
# organisation's package settings, or anonymous pulls will fail.
name: Book Toolchain Image

on:
  push:
    branches: [main]
    paths:
      - 'hkj-book/toolchain-pins.sh'
      - 'hkj-book/docker/**'
      - '.github/workflows/book-toolchain-image.yml'
  pull_request:
    paths:
      - 'hkj-book/toolchain-pins.sh'
      - 'hkj-book/docker/**'
      - '.github/workflows/book-toolchain-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # Only here: a contributor's fork, with workflows enabled, has none of the secrets this needs.
    if: github.repository == 'higher-kinded-j/higher-kinded-j'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Work out the image reference
        id: ref
        run: echo "image=$(hkj-book/docker.sh image)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build without pushing, which proves the Dockerfile and pins agree.
      - name: Build, and push except on pull requests
        uses: docker/build-push-action@v6
        with:
          context: hkj-book
          file: hkj-book/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

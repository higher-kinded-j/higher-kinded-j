name: Java CI with Gradle, JaCoCo, and Codecov

# Trigger workflow on pushes to the main branch and any pull request. workflow_dispatch lets a
# contributor run it on a branch of their fork, from the fork's Actions tab, before opening a PR.
on:
  push:
    branches: [ "main" ] # Adjust if your main branch is named differently
  pull_request:
    branches: [ "main" ] # Adjust if your main branch is named differently
  workflow_dispatch:

# Set default permissions for the GITHUB_TOKEN
permissions:
  contents: read # Allow checkout

jobs:
  build-and-test: # Define a job named 'build-and-test'
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
      # 1. Check out repository code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check that the repository's prose uses British spelling, as docs/STYLE-GUIDE.md asks.
      #    It reads only non-code text and needs no build, so it runs first. The steps after it
      #    run even when a step before them fails (!cancelled()), so one push reports every
      #    failure: a misspelling or a stale golden file does not hide the build's results.
      - name: Check British spelling in prose
        run: node .github/scripts/british-spelling-check.cjs

      # 3. Set up the specified JDK version (Java 25, which the build requires)
      - name: Set up JDK 25
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin' # Or 'zulu', 'adopt', etc.

      # 4. Grant execute permissions to the Gradle wrapper script
      - name: Grant execute permission for gradlew
        if: ${{ !cancelled() }}
        run: chmod +x gradlew

      # 5. Verify golden files are up to date.
      #    Regenerates golden files and fails if any differs from what's committed, or is new
      #    and not committed at all, which the build's own tests would not notice. This ensures
      #    code generator changes are always accompanied by updated golden files. The release
      #    gate (releaseReadiness) runs the same task. A failure leaves the regenerated files in
      #    the working tree, and the build's golden tests read those, so the step puts the
      #    committed copies back before the build compares against them.
      - name: Verify golden files are up to date
        if: ${{ !cancelled() }}
        run: |
          if ! ./gradlew :hkj-processor:verifyGoldenFiles; then
            echo "::error::Golden file check failed (see the log). If the golden files are out of date, run ./gradlew :hkj-processor:updateGoldenFiles and commit them."
            git checkout HEAD -- hkj-processor/src/test/resources/golden
            git clean -fdq -- hkj-processor/src/test/resources/golden
            exit 1
          fi

      # 6. Run the Gradle build task.
      #    This will compile, run tests (triggering jacocoTestReport via finalizedBy)
      #    and generate the XML report needed by Codecov. --continue runs every task that does
      #    not depend on a failed one, so a formatting failure does not hide the test results.
      #    javadoc builds every module's Javadoc, as the snapshot publish on main does, so a
      #    comment javadoc refuses fails the pull request rather than the publish.
      - name: Build with Gradle & Generate JaCoCo Report
        id: build
        if: ${{ !cancelled() }}
        run: ./gradlew build javadoc --continue -x :hkj-benchmarks:test -x :hkj-benchmarks:jmhClasses

      # 7. Upload the generated JaCoCo XML report to Codecov, whenever the build passed, even if
      #    the spelling or golden file check failed. A run hosted in a contributor's fork has no
      #    Codecov token, so it skips the upload; a pull request from a fork runs here, and
      #    uploads as before.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.repository == 'higher-kinded-j/higher-kinded-j' }}
        uses: codecov/codecov-action@v4 # Use the official Codecov action
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # Read the token from GitHub secrets
          # Optional configurations for the Codecov action:
          # with:
          # files: ./build/reports/jacoco/test/jacocoTestReport.xml # Specify report file if not default
          # flags: unittests # Add flags to categorise coverage reports
          # fail_ci_if_error: true # Make the workflow fail if Codecov upload fails


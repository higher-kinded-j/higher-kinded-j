# Higher-Kinded-J 0.5.0 Migration Recipes
# Rewrites usages of APIs deprecated for removal in 0.5.0 to their replacements,
# removes a deprecated annotation that has no effect, replaces two deprecated
# @PathSource capabilities with the levels they generate, and drops the Monad
# argument that StateT no longer takes. It adds to @GenerateFocus's widenFields
# each container a 0.4.x navigator stepped into. It also marks, without
# rewriting, each null success or null error that 0.5.0 refuses, and each
# container it would widen but for an element field named like a path method.
#
# Run these with hkj-openrewrite 0.5.0 before the project moves to 0.5.0: they
# match the 0.4.x signatures, and the StateT and widenFields rewrites compile
# only against 0.5.0.
#
# Usage:
#   rewrite {
#     activeRecipe("org.higherkindedj.openrewrite.MigrateDeprecationsTo0_5_0")
#   }

---
type: specs.openrewrite.org/v1beta/recipe
name: org.higherkindedj.openrewrite.MigrateDeprecationsTo0_5_0
displayName: Migrate Higher-Kinded-J APIs deprecated or changed in 0.5.0
description: >-
  Rewrites call sites of Higher-Kinded-J methods deprecated for removal in
  0.5.0 to their replacements: StateTKind.narrowK -> StateTKind.narrow,
  KindValidator.narrowWithPattern -> KindValidator.narrowHolder, and
  Try.fold / TryPath.fold (success-first) -> foldFailureFirst (error-first,
  with arguments swapped). Also removes @PathConfig, which has no effect, and
  replaces @PathSource's EFFECTFUL and ACCUMULATING capabilities with the
  levels they generate, CHAINABLE and RECOVERABLE. Drops the Monad argument
  from StateT construction and StateT.mapT. Adds to @GenerateFocus's
  widenFields each Map, or third-party collection, of @GenerateFocus records
  that a 0.4.x navigator stepped into, on a record that writes
  generateNavigators = true, and marks one whose elements have a field named
  like a path method, since 0.5.0 can give it no navigator. Finally marks each
  null passed to a success factory, Try.of supplier returning null, and
  Either, Try or
  Path typed with Void, since a Right or Success always holds a value. It
  also marks each null given as an error, as to Either.left or raiseError,
  each mapLeft or bimap error lambda returning null, and Either typed with a
  Void error, since a Left always holds an error.
tags:
  - higher-kinded-j
  - migration
  - deprecation
recipeList:
  - org.higherkindedj.openrewrite.RenameStateTKindNarrowK
  - org.higherkindedj.openrewrite.RenameKindValidatorNarrowWithPattern
  - org.higherkindedj.openrewrite.SwapTryFoldToFoldFailureFirstRecipe
  - org.higherkindedj.openrewrite.RemovePathConfig
  - org.higherkindedj.openrewrite.ReplaceDeprecatedPathSourceCapabilitiesRecipe
  - org.higherkindedj.openrewrite.RemoveStateTMonadArgument
  - org.higherkindedj.openrewrite.AddWidenFieldsForNavigatedContainersRecipe
  - org.higherkindedj.openrewrite.DetectNullSuccessValuesRecipe
  - org.higherkindedj.openrewrite.DetectNullErrorValuesRecipe

---
type: specs.openrewrite.org/v1beta/recipe
name: org.higherkindedj.openrewrite.RenameStateTKindNarrowK
displayName: StateTKind.narrowK -> StateTKind.narrow
description: >-
  StateTKind.narrowK, deprecated since 0.4.5, is removed in 0.5.0; its
  wildcard Kind parameter bypassed witness type safety. Replaces call sites
  with the type-safe StateTKind.narrow, which takes a
  Kind<StateTKind.Witness<S, F>, A>, so an argument typed Kind<?, A> needs
  that type declared by hand. The recipe matches only the removed method,
  so run it while the project is on 0.4.x.
tags:
  - higher-kinded-j
  - deprecation
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.higherkindedj.hkt.state_t.StateTKind narrowK(..)
      newMethodName: narrow
      ignoreDefinition: true

---
type: specs.openrewrite.org/v1beta/recipe
name: org.higherkindedj.openrewrite.RenameKindValidatorNarrowWithPattern
displayName: KindValidator.narrowWithPattern -> KindValidator.narrowHolder
description: >-
  KindValidator.narrowWithPattern, deprecated since 0.4.4, is removed in
  0.5.0. The replacement narrowHolder has an identical signature; this is a
  pure rename. The recipe matches only the removed method, so run it while
  the project is on 0.4.x.
tags:
  - higher-kinded-j
  - deprecation
recipeList:
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.higherkindedj.hkt.util.validation.KindValidator narrowWithPattern(..)
      newMethodName: narrowHolder
      ignoreDefinition: true

---
type: specs.openrewrite.org/v1beta/recipe
name: org.higherkindedj.openrewrite.RemovePathConfig
displayName: Remove @PathConfig
description: >-
  @PathConfig was deprecated in 0.4.11 and is removed in 0.5.0, so the
  recipe matches it only while the project compiles against 0.4.x: run it
  before the project moves to 0.5.0. No processor reads it, so removing it
  from a package-info.java changes nothing generated. A type whose Path
  class should be named with another suffix sets @PathSource(suffix = ...)
  instead.
tags:
  - higher-kinded-j
  - deprecation
recipeList:
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: '@org.higherkindedj.hkt.effect.annotation.PathConfig'

---
type: specs.openrewrite.org/v1beta/recipe
name: org.higherkindedj.openrewrite.RemoveStateTMonadArgument
displayName: Remove the Monad argument from StateT construction and mapT
description: >-
  StateT holds only its state function from 0.5.0, so its constructor,
  StateT.create and StateTKindHelper.stateT take the function alone, and
  StateT.mapT takes only the transformation. Removes the Monad argument from
  each call. Run it before the project moves to 0.5.0, since it matches the
  0.4.x signatures. A StateT held in var over a witness with a type argument,
  such as EitherKind.Witness<E>, may then need its type arguments named.
tags:
  - higher-kinded-j
  - migration
recipeList:
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.higherkindedj.hkt.state_t.StateT <constructor>(java.util.function.Function, org.higherkindedj.hkt.Monad)
      argumentIndex: 1
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.higherkindedj.hkt.state_t.StateT create(java.util.function.Function, org.higherkindedj.hkt.Monad)
      argumentIndex: 1
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.higherkindedj.hkt.state_t.StateTKindHelper stateT(java.util.function.Function, org.higherkindedj.hkt.Monad)
      argumentIndex: 1
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.higherkindedj.hkt.state_t.StateT mapT(org.higherkindedj.hkt.Monad, java.util.function.Function)
      argumentIndex: 0

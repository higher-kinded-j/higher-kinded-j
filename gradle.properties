org.gradle.jvmargs=-Xmx2g

# The version a merge to main publishes to the snapshots repository. Once a release is tagged,
# move it to the next release's -SNAPSHOT. checkSnapshotVersion, which check runs, compares it with
# the latest release tag, and asks you to confirm a minor or major step, recording a yes as
# confirmedSnapshotVersion. Publishing from main runs the same check, and cannot ask.
snapshotVersion=0.5.0-SNAPSHOT
